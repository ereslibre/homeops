# This is a specific service used for the shelly gen 1 devices using
# the CoIoT protocol. It is reached from the LAN through the
# ingress-nginx UDP 5683 mapping (the devices' CoIoT peer points to a
# node), so it does not need to be a LoadBalancer: that one cannot get
# a port on the nodes anyway, as ingress-nginx's already holds 5683.
# Home Assistant matches CoIoT packets by device id, not source IP.
apiVersion: v1
kind: Service
metadata:
  name: shelly-coiot
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: coiot
      port: 5683
      targetPort: 5683
      protocol: UDP
