apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/home-assistant
  - backup-sealed-secret.yaml
  - backup-schedule.yaml
  - restic-sealed-secret.yaml
  - secrets-sealed-secret.yaml
# Frontend module that locks the kitchen display during a visit; served from
# /config/www and loaded through extra_module_url.
configMapGenerator:
  - name: visit-lock
    namespace: home-assistant
    files:
      - visit-lock.js
  # Lets the apple_tv integration connect to the Apple TV although mDNS
  # discovery never reaches the pod; see apple_tv_direct/__init__.py.
  - name: apple-tv-direct
    namespace: home-assistant
    files:
      - apple_tv_direct/__init__.py
      - apple_tv_direct/manifest.json
patches:
  # Install the kef_connector (KEF LSX II) and huawei_solar custom components,
  # and the kiosk-mode frontend plugin, into the config volume. Pinned by
  # version and checksum; a failed download never blocks Home Assistant from
  # starting, it just leaves whatever is already there.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: home-assistant
        namespace: home-assistant
      spec:
        template:
          spec:
            initContainers:
              - name: install-kef-connector
                image: ghcr.io/home-assistant/home-assistant:2026.10
                imagePullPolicy: IfNotPresent
                env:
                  - name: KEF_CONNECTOR_VERSION
                    value: "0.6.5"
                  - name: KEF_CONNECTOR_SHA256
                    value: "d94fd37d348d74453e26e120950f42470d7065edf52a5677fbd80528a15fe232"
                command:
                  - sh
                  - -c
                  - |
                    dest=/config/custom_components/kef_connector
                    if grep -q "\"version\": *\"${KEF_CONNECTOR_VERSION}\"" "${dest}/manifest.json" 2>/dev/null; then
                      echo "kef_connector ${KEF_CONNECTOR_VERSION} already installed"
                      exit 0
                    fi
                    tmp=$(mktemp -d)
                    if curl -fsSL --max-time 60 -o "${tmp}/src.tar.gz" "https://github.com/N0ciple/hass-kef-connector/archive/refs/tags/${KEF_CONNECTOR_VERSION}.tar.gz" \
                      && echo "${KEF_CONNECTOR_SHA256}  ${tmp}/src.tar.gz" | sha256sum -c - \
                      && tar -xzf "${tmp}/src.tar.gz" -C "${tmp}"; then
                      mkdir -p /config/custom_components
                      rm -rf "${dest}"
                      cp -r "${tmp}/hass-kef-connector-${KEF_CONNECTOR_VERSION}/custom_components/kef_connector" "${dest}"
                      echo "kef_connector ${KEF_CONNECTOR_VERSION} installed"
                    else
                      echo "WARNING: could not install kef_connector ${KEF_CONNECTOR_VERSION}, leaving ${dest} untouched"
                    fi
                    exit 0
                volumeMounts:
                  - name: config-root
                    mountPath: /config
              - name: install-huawei-solar
                image: ghcr.io/home-assistant/home-assistant:2026.10
                imagePullPolicy: IfNotPresent
                env:
                  - name: HUAWEI_SOLAR_VERSION
                    value: "2.1.5"
                  - name: HUAWEI_SOLAR_SHA256
                    value: "aa53ffa4ee1a9774038670cfda3519f2c4905ca12b0aa96cc6b016b40cf7a72b"
                command:
                  - sh
                  - -c
                  - |
                    dest=/config/custom_components/huawei_solar
                    if grep -q "\"version\": *\"${HUAWEI_SOLAR_VERSION}\"" "${dest}/manifest.json" 2>/dev/null; then
                      echo "huawei_solar ${HUAWEI_SOLAR_VERSION} already installed"
                      exit 0
                    fi
                    tmp=$(mktemp -d)
                    # The integration lives at the root of the repository.
                    if curl -fsSL --max-time 60 -o "${tmp}/src.tar.gz" "https://github.com/wlcrs/huawei_solar/archive/refs/tags/${HUAWEI_SOLAR_VERSION}.tar.gz" \
                      && echo "${HUAWEI_SOLAR_SHA256}  ${tmp}/src.tar.gz" | sha256sum -c - \
                      && tar -xzf "${tmp}/src.tar.gz" -C "${tmp}"; then
                      mkdir -p /config/custom_components
                      rm -rf "${dest}"
                      cp -r "${tmp}/huawei_solar-${HUAWEI_SOLAR_VERSION}" "${dest}"
                      echo "huawei_solar ${HUAWEI_SOLAR_VERSION} installed"
                    else
                      echo "WARNING: could not install huawei_solar ${HUAWEI_SOLAR_VERSION}, leaving ${dest} untouched"
                    fi
                    exit 0
                volumeMounts:
                  - name: config-root
                    mountPath: /config
              - name: install-kiosk-mode
                image: ghcr.io/home-assistant/home-assistant:2026.10
                imagePullPolicy: IfNotPresent
                env:
                  - name: KIOSK_MODE_VERSION
                    value: "15.0.0"
                  - name: KIOSK_MODE_SHA256
                    value: "b54c24054c27980faeace330bbf019f3b03e54acfda190573a26026cddbf6cf1"
                command:
                  - sh
                  - -c
                  - |
                    dest=/config/www/kiosk-mode
                    if [ "$(cat "${dest}/VERSION" 2>/dev/null)" = "${KIOSK_MODE_VERSION}" ]; then
                      echo "kiosk-mode ${KIOSK_MODE_VERSION} already installed"
                      exit 0
                    fi
                    tmp=$(mktemp -d)
                    if curl -fsSL --max-time 60 -o "${tmp}/kiosk-mode.js" "https://github.com/NemesisRE/kiosk-mode/releases/download/v${KIOSK_MODE_VERSION}/kiosk-mode.js" \
                      && echo "${KIOSK_MODE_SHA256}  ${tmp}/kiosk-mode.js" | sha256sum -c -; then
                      mkdir -p "${dest}"
                      cp "${tmp}/kiosk-mode.js" "${dest}/kiosk-mode.js"
                      echo "${KIOSK_MODE_VERSION}" > "${dest}/VERSION"
                      echo "kiosk-mode ${KIOSK_MODE_VERSION} installed"
                    else
                      echo "WARNING: could not install kiosk-mode ${KIOSK_MODE_VERSION}, leaving ${dest} untouched"
                    fi
                    exit 0
                volumeMounts:
                  - name: config-root
                    mountPath: /config
            # secrets.yaml for `!secret` references, from a SealedSecret.
            containers:
              - name: home-assistant-app
                volumeMounts:
                  - name: secrets
                    mountPath: /config/secrets.yaml
                    subPath: secrets.yaml
                    readOnly: true
                  - name: visit-lock
                    mountPath: /config/www/visit-lock/visit-lock.js
                    subPath: visit-lock.js
                    readOnly: true
                  - name: apple-tv-direct
                    mountPath: /config/custom_components/apple_tv_direct
                    readOnly: true
            volumes:
              - name: secrets
                secret:
                  secretName: home-assistant-secrets
              - name: visit-lock
                configMap:
                  name: visit-lock
              - name: apple-tv-direct
                configMap:
                  name: apple-tv-direct
    target:
      kind: Deployment
      name: home-assistant
      namespace: home-assistant
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: home-assistant
        namespace: home-assistant
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
      spec:
        ingressClassName: nginx
        rules:
        - host: home-assistant.ereslibre.net
          http:
            paths:
            - pathType: Prefix
              path: /
              backend:
                service:
                  name: home-assistant
                  port:
                    name: http
        tls:
        - hosts:
          - home-assistant.ereslibre.net
          secretName: home-assistant-ereslibre-net-cert
    target:
      kind: Ingress
      name: home-assistant
      namespace: home-assistant
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: configurations
        namespace: home-assistant
      data:
        configuration.yaml: |
          # Loads default set of integrations. Do not remove.
          default_config:

          # Enable API
          api:

          # The http settings (use_x_forwarded_for, trusted_proxies 10.0.0.0/8,
          # ip_ban_enabled false, login_attempts_threshold 5) are no longer
          # accepted here since 2026.10: they were imported into the config
          # volume and are now managed in Settings > System > Network. On a
          # fresh volume they have to be set again there, or the ingress is
          # not trusted as a proxy.

          # The Apple TV (static DHCP mapping, 10.0.1.35) is never found over
          # mDNS from the pod; connect to it directly instead.
          apple_tv_direct:

          # mDNS reflector: tell homekit the advertise IP address
          homekit:
            advertise_ip: "10.0.4.31"

          # LSX II: needs the kef_connector custom component in
          # /config/custom_components (the built-in kef platform only speaks
          # the first generation protocol).
          media_player:
            - platform: kef_connector
              host: "10.0.1.36"
              speaker_model: LSX2
              name: Salón
              maximum_volume: 1
              volume_step: 0.05

          # Govee H6076 floor lamp, driven through its LAN API (UDP 4003).
          # The lamp replies to port 4002 of the sender, which never makes it
          # back into the pod, so everything here is one-way and optimistic.
          # The lamp needs a fixed IP (DHCP reservation).
          shell_command:
            govee_send: >-
              python3 -c "import socket, sys;
              socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(sys.argv[1].encode(), ('10.0.1.37', 4003))"
              '{{ dict(msg=dict(cmd=cmd, data=data)) | to_json }}'

          template:
            - light:
                - name: "Govee Lamp"
                  unique_id: govee_lamp
                  icon: mdi:floor-lamp
                  min_mireds: 154
                  max_mireds: 455
                  turn_on:
                    - action: shell_command.govee_send
                      data:
                        cmd: turn
                        data:
                          value: 1
                  turn_off:
                    - action: shell_command.govee_send
                      data:
                        cmd: turn
                        data:
                          value: 0
                  set_level:
                    - action: shell_command.govee_send
                      data:
                        cmd: brightness
                        data:
                          value: "{{ [1, (brightness / 255 * 100) | round | int] | max }}"
                  set_rgb:
                    - action: shell_command.govee_send
                      data:
                        cmd: turn
                        data:
                          value: 1
                    - action: shell_command.govee_send
                      data:
                        cmd: colorwc
                        data:
                          color:
                            r: "{{ r }}"
                            g: "{{ g }}"
                            b: "{{ b }}"
                          colorTemInKelvin: 0
                  set_temperature:
                    - action: shell_command.govee_send
                      data:
                        cmd: turn
                        data:
                          value: 1
                    - action: shell_command.govee_send
                      data:
                        cmd: colorwc
                        data:
                          color:
                            r: 0
                            g: 0
                            b: 0
                          colorTemInKelvin: "{{ (1000000 / color_temp) | round | int }}"

            # Kept so existing automations, dashboards and HomeKit keep working;
            # it just mirrors light.govee_lamp.
            - switch:
                - name: "Govee Light"
                  unique_id: govee_light
                  default_entity_id: switch.govee
                  state: "{{ is_state('light.govee_lamp', 'on') }}"
                  turn_on:
                    - action: light.turn_on
                      target:
                        entity_id: light.govee_lamp
                  turn_off:
                    - action: light.turn_off
                      target:
                        entity_id: light.govee_lamp

          # Visit mode needs a PIN to end. The panel is the source of truth:
          # arming it (or turning on input_boolean.hay_visita) starts a visit,
          # and only disarming it, which asks for the code, ends it. The boolean
          # just mirrors the panel for dashboards and automations.
          alarm_control_panel:
            - platform: manual
              name: "Modo visita"
              unique_id: visit_mode_panel
              code: !secret visita_pin
              code_arm_required: false
              arming_time: 0
              delay_time: 0

          automation visita:
            - id: visit_mode_panel_follows_boolean
              alias: "Modo visita: activar la visita arma el panel"
              mode: queued
              triggers:
                - trigger: state
                  entity_id: input_boolean.hay_visita
                  from: "off"
                  to: "on"
              conditions:
                - condition: state
                  entity_id: alarm_control_panel.modo_visita
                  state: disarmed
              actions:
                - action: alarm_control_panel.alarm_arm_away
                  target:
                    entity_id: alarm_control_panel.modo_visita

            - id: visit_mode_boolean_follows_panel
              alias: "Modo visita: el interruptor sigue al panel"
              mode: queued
              triggers:
                - trigger: state
                  entity_id: alarm_control_panel.modo_visita
                - trigger: homeassistant
                  event: start
              actions:
                - choose:
                    - conditions:
                        - condition: state
                          entity_id: alarm_control_panel.modo_visita
                          state: disarmed
                        - condition: state
                          entity_id: input_boolean.hay_visita
                          state: "on"
                      sequence:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: input_boolean.hay_visita
                    - conditions:
                        - condition: not
                          conditions:
                            - condition: state
                              entity_id: alarm_control_panel.modo_visita
                              state: disarmed
                        - condition: state
                          entity_id: input_boolean.hay_visita
                          state: "off"
                      sequence:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.hay_visita

            # Turning the boolean off while the panel is still armed did not go
            # through the PIN: put it back.
            - id: visit_mode_boolean_guard
              alias: "Modo visita: sin PIN no se termina"
              mode: queued
              triggers:
                - trigger: state
                  entity_id: input_boolean.hay_visita
                  from: "on"
                  to: "off"
              conditions:
                - condition: not
                  conditions:
                    - condition: state
                      entity_id: alarm_control_panel.modo_visita
                      state: disarmed
              actions:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.hay_visita

            # Snapshot the protected entities when a visit starts, so anything the
            # kitchen display changes outside the allow-list can be put back.
            - id: visit_mode_snapshot
              alias: "Modo visita: foto del estado al empezar"
              triggers:
                - trigger: state
                  entity_id: input_boolean.hay_visita
                  to: "on"
              actions:
                - action: scene.create
                  data:
                    scene_id: antes_de_la_visita
                    snapshot_entities:
                      - input_boolean.vacaciones
                      - input_boolean.no_encender_el_aire_acondicionado
                      - input_boolean.ac_turned_on_automatically
                      - siren.entrada_sirena
                      - siren.terraza_sirena

            # Server-side backstop. HA cannot refuse a service call from a non-admin
            # user, but every call fires `call_service` with the caller's user id, so
            # calls from the kitchen account during a visit that fall outside the
            # allow-list are undone and reported.
            - id: visit_mode_enforce_allow_list
              alias: "Modo visita: deshacer acciones no permitidas desde la cocina"
              mode: queued
              variables:
                display_user: bccfedc6e53a414da0b87ee6277f0e6a  # "Family", the kitchen display
                allowed_domains: [media_player, light, cover, climate, camera]
                allowed_entities:
                  - switch.salon_luz_mueble_salon
                  - switch.espejo
                  - switch.shelly_main_mirror
                  - alarm_control_panel.modo_visita   # the PIN check itself is server-side
                  - input_boolean.hay_visita          # turning it off is undone by the guard
              triggers:
                - trigger: event
                  event_type: call_service
              conditions:
                - condition: state
                  entity_id: input_boolean.hay_visita
                  state: "on"
                - condition: template
                  value_template: >-
                    {% set d = trigger.event.data %}
                    {% set ids = d.service_data.entity_id | default([]) %}
                    {% set ids = [ids] if ids is string else ids | list %}
                    {{ trigger.event.context.user_id == display_user
                       and d.domain not in allowed_domains
                       and (ids | count == 0 or ids | reject('in', allowed_entities) | list | count > 0) }}
              actions:
                - delay: 2
                - action: scene.turn_on
                  target:
                    entity_id: scene.antes_de_la_visita
                - action: persistent_notification.create
                  data:
                    title: "Modo visita"
                    message: >-
                      La cocina intentó {{ trigger.event.data.domain }}.{{ trigger.event.data.service }}
                      {{ trigger.event.data.service_data.entity_id | default('') }}; se ha deshecho.

          # Office ambient lights as one entity: the Hue zone only covers the
          # two Hue lamps, this also includes the Nanoleaf and the Govee lamp.
          light:
            - platform: group
              name: "Ambiente despacho"
              unique_id: office_ambient_lights
              entities:
                - light.shapes_219e
                - light.govee_lamp
                - light.bookshelf
                - light.desk

          mqtt:
            sensor:
              - name: CO2
                default_entity_id: sensor.office_air_monitor_co2
                device_class: carbon_dioxide
                unit_of_measurement: "ppm"
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ value_json.sensorData.0.co2.value
                    if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 9a0db1bc69a41507a757c5d222d4a845dc244d82
              - name: PM2.5
                default_entity_id: sensor.office_air_monitor_pm25
                device_class: pm25
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ value_json.sensorData.0.pm25.value
                    if value_json.type=="17" else this.state }}
                unit_of_measurement: "µg/m³"
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: b7e9459ef047905d96918d8e247b0c3dd61b7cc8
              - name: PM10
                default_entity_id: sensor.office_air_monitor_pm10
                device_class: pm10
                unit_of_measurement: "µg/m³"
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ value_json.sensorData.0.pm10.value
                    if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 4beba1f55c9fc38b528353a3eeae9df9db9eae0f
              - name: TVOC
                default_entity_id: sensor.office_air_monitor_tvoc
                device_class: volatile_organic_compounds
                unit_of_measurement: "mg/m³"
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ (value_json.sensorData.0.tvoc.value / 218.77) | round(3)
                    if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 049dba2512f7e141b094799e308d587b1e199174
              - name: Humedad
                default_entity_id: sensor.office_air_monitor_humidity
                device_class: humidity
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ value_json.sensorData.0.humidity.value|round(2)
                    if value_json.type=="17" else this.state }}
                unit_of_measurement: "%"
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: fca28b722b2d263cdda7906b1f1fda67366c9f42
              - default_entity_id: sensor.office_air_monitor_temperature
                name: Temperatura
                device_class: temperature
                unit_of_measurement: "°C"
                state_topic: "homeassistant/qingping/582D34701BA9/up"
                value_template: >-
                  {{ value_json.sensorData.0.temperature.value|round(2)
                      if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D34701BA9/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D34701BA9"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: c70b69d6dc1ff5ef3c1e86ecca3e547ae11c3c66
              - name: CO2
                default_entity_id: sensor.living_room_air_monitor_co2
                device_class: carbon_dioxide
                unit_of_measurement: "ppm"
                state_topic: "homeassistant/qingping/582D3401491F/up"
                value_template: >-
                  {{ value_json.sensorData.0.co2.value
                    if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D3401491F/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D3401491F"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 848adb96-7b50-4b7c-a940-6223df7e1168
              - name: PM2.5
                default_entity_id: sensor.living_room_air_monitor_pm25
                device_class: pm25
                state_topic: "homeassistant/qingping/582D3401491F/up"
                value_template: >-
                  {{ value_json.sensorData.0.pm25.value
                    if value_json.type=="17" else this.state }}
                unit_of_measurement: "µg/m³"
                availability:
                  - topic: "homeassistant/qingping/582D3401491F/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D3401491F"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 4e7d8563-798f-4313-869d-2b597377fe8f
              - name: PM10
                default_entity_id: sensor.living_room_air_monitor_pm10
                device_class: pm10
                unit_of_measurement: "µg/m³"
                state_topic: "homeassistant/qingping/582D3401491F/up"
                value_template: >-
                  {{ value_json.sensorData.0.pm10.value
                    if value_json.type=="17" else this.state }}
                availability:
                  - topic: "homeassistant/qingping/582D3401491F/up"
                    payload_available: "true"
                    payload_not_available: "false"
                    value_template: >-
                      {{ "true" if value_json else "false" }}
                device:
                  identifiers: ["582D3401491F"]
                  name: "Monitor de aire"
                  model: "CGS1"
                  manufacturer: "qingping"
                unique_id: 837ab652-77f8-43a0-9aaa-db3abfad206f
              - name: TVOC
                default_entity_id: sensor.living_room_air_monitor_tvoc
